<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <!-- violation: no viewport meta -->
  <title>Sign up</title>
  <style>
    /* violation: no design tokens, hardcoded colors */
    body {
      font-family: Arial;
      /* violation: font 11px (below 16px) */
      font-size: 11px;
      /* violation: contrast deficient #aaa on #fff (1.6:1) */
      color: #aaaaaa;
      background: #ffffff;
      /* violation: not responsive, fixed px */
      width: 900px;
    }
    .row { margin: 6px 0; }
    /* violation: input small, touch target deficient */
    input {
      width: 200px;
      height: 18px;
      font-size: 11px;
      color: #aaaaaa;
      border: 1px solid #cccccc;
    }
    /* violation: div used as a button, not semantic */
    .btn {
      display: inline-block;
      width: 90px;
      background: #cccccc;
      color: #dddddd;        /* violation: almost no contrast */
      text-align: center;
      font-size: 11px;
      padding: 4px;
    }
  </style>
</head>
<body>
  <div style="font-size:14px;">Sign up</div>

  <!-- violation: no label, placeholder only -->
  <div class="row">
    <input type="text" id="email" placeholder="Email">
  </div>
  <div class="row">
    <input type="text" id="password" placeholder="Password">
  </div>

  <!-- violation: error message says only "error", no resolution -->
  <div class="row" id="err" style="color:#aaaaaa; display:none;">error</div>

  <!-- violation: <div onclick> used as a button (no keyboard, not semantic) -->
  <div class="btn" onclick="doSignup()">Sign up</div>

  <script>
    // violation: no loading/error/success state, error message with no resolution
    function doSignup() {
      var email = document.getElementById('email').value;
      var pw = document.getElementById('password').value;
      var err = document.getElementById('err');
      // the logic works: block if empty, otherwise pass
      if (!email || !pw) {
        err.style.display = 'block';
        err.textContent = 'error';   // violation: no resolution
        return;
      }
      // violation: no success feedback / loading state. alert only.
      alert('signed up');
    }
  </script>
</body>
</html>
