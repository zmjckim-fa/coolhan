<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <!-- 위반: 뷰포트 meta 없음 -->
  <title>회원가입</title>
  <style>
    /* 위반: 디자인 토큰 없음, 색상 하드코딩 */
    body {
      font-family: Arial;
      /* 위반: 폰트 11px (16px 미달) */
      font-size: 11px;
      /* 위반: 색대비 미달 #aaa on #fff (1.6:1) */
      color: #aaaaaa;
      background: #ffffff;
      /* 위반: 반응형 없음, 고정 px */
      width: 900px;
    }
    .row { margin: 6px 0; }
    /* 위반: input 작음, 터치타깃 미달 */
    input {
      width: 200px;
      height: 18px;
      font-size: 11px;
      color: #aaaaaa;
      border: 1px solid #cccccc;
    }
    /* 위반: div를 버튼처럼 사용, 시맨틱X */
    .btn {
      display: inline-block;
      width: 90px;
      background: #cccccc;
      color: #dddddd;        /* 위반: 대비 거의 없음 */
      text-align: center;
      font-size: 11px;
      padding: 4px;
    }
  </style>
</head>
<body>
  <div style="font-size:14px;">회원가입</div>

  <!-- 위반: label 없음, placeholder만 -->
  <div class="row">
    <input type="text" id="email" placeholder="이메일">
  </div>
  <div class="row">
    <input type="text" id="password" placeholder="비밀번호">
  </div>

  <!-- 위반: 에러문구 "오류"만, 해결방안 없음 -->
  <div class="row" id="err" style="color:#aaaaaa; display:none;">오류</div>

  <!-- 위반: <div onclick>로 버튼 대체 (키보드X, 시맨틱X) -->
  <div class="btn" onclick="doSignup()">가입</div>

  <script>
    // 위반: 로딩/에러/성공 상태 없음, 해결안 없는 에러문구
    function doSignup() {
      var email = document.getElementById('email').value;
      var pw = document.getElementById('password').value;
      var err = document.getElementById('err');
      // 로직은 동작: 빈 값이면 막고, 아니면 통과
      if (!email || !pw) {
        err.style.display = 'block';
        err.textContent = '오류';   // 위반: 해결방안 없음
        return;
      }
      // 위반: 성공 피드백/로딩 상태 없음. alert만.
      alert('가입');
    }
  </script>
</body>
</html>
