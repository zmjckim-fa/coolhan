name: "Feature Request"
description: "Suggest a new feature or enhancement for CoolHan"
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: "Feature Area"
      options:
        - "New domain module (knowledge_base)"
        - "New agent or harness"
        - "Validation improvement (Task 4)"
        - "Planner intent enforcement"
        - "Dashboard / UI improvement"
        - "New language support"
        - "Installation / npm package"
        - "Voynich Research Tool"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "Problem Statement"
      description: "What problem does this feature solve?"
      placeholder: "Currently, the validator cannot detect..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "Describe your proposed feature"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Any alternative solutions you considered?"

  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      options:
        - "High -- core workflow impact"
        - "Medium -- improves experience"
        - "Low -- nice to have"
    validations:
      required: true
