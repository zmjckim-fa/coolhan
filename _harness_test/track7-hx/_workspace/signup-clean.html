<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Responsive: viewport meta -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up</title>
  <style>
    /* HX-9 design tokens (CSS variables, no hardcoded colors) */
    :root {
      --color-text: #1a1a1a;        /* on #fff → meets contrast */
      --color-bg: #ffffff;
      --color-primary: #0b5fff;     /* primary button */
      --color-primary-text: #ffffff;
      --color-error: #b00020;       /* on #fff → meets contrast */
      --color-success: #0a7d33;
      --color-border: #6b7280;
      --color-muted: #4b5563;
      --font-base: 16px;            /* body 16px+ */
      --font-label: 16px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --radius: 8px;
      --touch-target: 44px;         /* touch target 44px */
      --line-height: 1.5;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: var(--font-base);
      line-height: var(--line-height);
      color: var(--color-text);
      background: var(--color-bg);
      margin: 0;
      padding: var(--space-lg);
    }
    main { max-width: 440px; margin: 0 auto; }
    h1 { font-size: 28px; margin-bottom: var(--space-lg); }
    .field { margin-bottom: var(--space-md); }
    label {
      display: block;
      font-size: var(--font-label);
      font-weight: 600;
      margin-bottom: var(--space-sm);
    }
    .required { color: var(--color-error); }
    input {
      width: 100%;
      min-height: var(--touch-target);
      font-size: var(--font-base);
      padding: 0 var(--space-md);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
    }
    /* Keep focus indication (focus ring) */
    input:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--color-primary);
      outline-offset: 2px;
    }
    .error-msg {
      color: var(--color-error);
      font-size: 14px;
      margin-top: var(--space-sm);
      display: none;
    }
    .field.invalid .error-msg { display: block; }
    .field.invalid input { border-color: var(--color-error); }
    /* 1 primary button, verb label, state distinction */
    button.primary {
      width: 100%;
      min-height: var(--touch-target);
      font-size: var(--font-base);
      font-weight: 600;
      color: var(--color-primary-text);
      background: var(--color-primary);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      margin-top: var(--space-md);
    }
    button.primary:hover { filter: brightness(0.92); }
    button.primary:active { filter: brightness(0.85); }
    button.primary:disabled { opacity: 0.6; cursor: not-allowed; }
    /* HX-6 states: loading/error/success */
    .status { margin-top: var(--space-md); font-size: 14px; }
    .status.loading { color: var(--color-muted); }
    .status.error { color: var(--color-error); }
    .status.success { color: var(--color-success); font-weight: 600; }
    .hint { color: var(--color-muted); font-size: 14px; margin-top: var(--space-sm); }
    /* HX-3 responsive media queries */
    @media (max-width: 640px) {
      body { padding: var(--space-md); }
      h1 { font-size: 24px; }
    }
    @media (min-width: 1025px) {
      main { max-width: 480px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Sign up</h1>
    <!-- semantic form -->
    <form id="signup-form" novalidate>
      <div class="field" id="field-email">
        <label for="email">Email <span class="required" aria-hidden="true">*</span></label>
        <input type="email" id="email" name="email" autocomplete="email"
               required aria-required="true" aria-describedby="email-error"
               placeholder="name@example.com">
        <!-- error message + resolution included -->
        <p class="error-msg" id="email-error" role="alert"></p>
      </div>

      <div class="field" id="field-password">
        <label for="password">Password <span class="required" aria-hidden="true">*</span></label>
        <input type="password" id="password" name="password" autocomplete="new-password"
               required aria-required="true" aria-describedby="password-hint password-error">
        <p class="hint" id="password-hint">At least 8 characters, including letters and numbers</p>
        <p class="error-msg" id="password-error" role="alert"></p>
      </div>

      <button type="submit" class="primary" id="submit-btn">Sign up</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    // HX-9 modularity: single-responsibility validation functions
    const form = document.getElementById('signup-form');
    const emailEl = document.getElementById('email');
    const pwEl = document.getElementById('password');
    const statusEl = document.getElementById('status');
    const submitBtn = document.getElementById('submit-btn');

    function setError(fieldId, errorId, message) {
      document.getElementById(fieldId).classList.add('invalid');
      document.getElementById(errorId).textContent = message;
    }
    function clearError(fieldId, errorId) {
      document.getElementById(fieldId).classList.remove('invalid');
      document.getElementById(errorId).textContent = '';
    }

    // error message + resolution included
    function validateEmail() {
      const v = emailEl.value.trim();
      if (!v) { setError('field-email', 'email-error', 'Please enter your email → enter in the format name@example.com'); return false; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) {
        setError('field-email', 'email-error', 'Email format is invalid → enter in the format name@example.com');
        return false;
      }
      clearError('field-email', 'email-error');
      return true;
    }
    function validatePassword() {
      const v = pwEl.value;
      if (v.length < 8 || !/[a-zA-Z]/.test(v) || !/[0-9]/.test(v)) {
        setError('field-password', 'password-error', 'Password is weak → enter at least 8 characters including letters and numbers');
        return false;
      }
      clearError('field-password', 'password-error');
      return true;
    }

    // inline real-time validation
    emailEl.addEventListener('blur', validateEmail);
    pwEl.addEventListener('blur', validatePassword);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const ok = [validateEmail(), validatePassword()].every(Boolean);
      if (!ok) {
        statusEl.className = 'status error';
        statusEl.textContent = 'Please check your input.';
        return;
      }
      // loading state
      submitBtn.disabled = true;
      statusEl.className = 'status loading';
      statusEl.textContent = 'Processing signup…';
      try {
        await new Promise((res) => setTimeout(res, 600)); // async for demo
        // success feedback
        statusEl.className = 'status success';
        statusEl.textContent = 'Signup completed.';
      } catch (err) {
        // error state + resolution (no empty catch)
        statusEl.className = 'status error';
        statusEl.textContent = 'Signup failed → please try again shortly or check your network.';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
