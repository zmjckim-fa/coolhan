name: "Voynich Research Data Submission"
description: "Submit new data, external research, or failure cases for the Voynich Research Tool"
title: "[VOYNICH-DATA] "
labels: ["voynich", "data-submission"]
body:
  - type: markdown
    attributes:
      value: |
        ## Important Principles

        This tool does NOT claim to decipher the Voynich Manuscript.
        External research is stored as **claims**, never as facts.
        Please read the [Research Principles](../../tools/voynich-reference-analyzer/README.md) before submitting.

  - type: dropdown
    id: data_type
    attributes:
      label: "Data Type"
      options:
        - "Primary Source (EVA transcription, folio images, VIB metadata)"
        - "External Research (paper, article, analysis)"
        - "Failure Case (past research approach that failed)"
        - "Comparison Corpus (natural language, herbal text, etc.)"
        - "Structural Observation (statistical finding)"
    validations:
      required: true

  - type: textarea
    id: source_info
    attributes:
      label: "Source Information"
      description: "Author, title, year, URL"
      value: |
        Author/Origin:
        Title:
        Year:
        URL:
    validations:
      required: true

  - type: textarea
    id: content
    attributes:
      label: "Data / Observation"
      description: "Describe the data or observation. For external research, describe what they found (NOT what we should conclude from it)."
    validations:
      required: true

  - type: dropdown
    id: evidence_tier
    attributes:
      label: "Evidence Tier"
      description: "How should this data be classified?"
      options:
        - "Primary Evidence -- Yale images, EVA transcription, folio metadata"
        - "Derived Evidence -- computed statistics, entropy, n-gram"
        - "External Claim -- researcher's assertion (stored separately from facts)"
        - "Hypothesis Evaluation -- assessment of our core hypothesis"
    validations:
      required: true

  - type: dropdown
    id: reliability
    attributes:
      label: "Source Reliability"
      options:
        - "Primary (Yale/official source)"
        - "High (peer-reviewed, widely used)"
        - "Medium (published, limited review)"
        - "Low (informal, unreviewed)"
        - "Unverified"
    validations:
      required: true

  - type: checkboxes
    id: principles
    attributes:
      label: "Confirmation"
      options:
        - label: "This submission does NOT claim to translate or decipher Voynich text"
          required: true
        - label: "External research conclusions are submitted as CLAIMS, not facts"
          required: true
        - label: "This data supports structural analysis of the manuscript"
          required: true
