<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>System Status · Status</title>
  <style>
    /* Mobile-first (375px) -> 768px -> 1200px (spec §2.2 responsive) */
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --ok: #22c55e;
      --warn: #eab308;
      --down: #ef4444;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 1rem;
      width: 100%;
      justify-content: center;
      background: rgba(148, 163, 184, 0.15);
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); flex: none; }
    .badge.ok   { color: var(--ok);   }  .badge.ok   .dot { background: var(--ok);   }
    .badge.warn { color: var(--warn); }  .badge.warn .dot { background: var(--warn); }
    .badge.down { color: var(--down); }  .badge.down .dot { background: var(--down); }
    dl {
      margin: 20px 0 0;
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      border-top: 1px solid rgba(148, 163, 184, 0.15);
      padding-top: 12px;
    }
    .row:first-child { border-top: none; padding-top: 0; }
    dt { color: var(--muted); font-size: 0.85rem; flex: none; }
    dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; word-break: break-all; }
    .err {
      margin-top: 16px;
      color: var(--down);
      font-size: 0.85rem;
      display: none;
    }
    .meta { margin-top: 16px; color: var(--muted); font-size: 0.75rem; text-align: center; }
    /* Tablet+ */
    @media (min-width: 768px) {
      .card { padding: 32px; }
      h1 { font-size: 1.5rem; }
    }
    /* Desktop */
    @media (min-width: 1200px) {
      .card { max-width: 560px; }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>System Status</h1>
    <div id="badge" class="badge" role="status" aria-live="polite">
      <span class="dot"></span><span id="badge-text">Checking…</span>
    </div>
    <dl>
      <div class="row"><dt>Uptime</dt><dd id="uptime">—</dd></div>
      <div class="row"><dt>Version</dt><dd id="version">—</dd></div>
      <div class="row"><dt>Last checked</dt><dd id="timestamp">—</dd></div>
    </dl>
    <p id="error" class="err"></p>
    <p class="meta">Auto-refreshes every 5 seconds · <code>/api/health</code></p>
  </main>

  <script>
    (function () {
      'use strict';
      var badge = document.getElementById('badge');
      var badgeText = document.getElementById('badge-text');
      var elUptime = document.getElementById('uptime');
      var elVersion = document.getElementById('version');
      var elTimestamp = document.getElementById('timestamp');
      var elError = document.getElementById('error');

      function setBadge(kind, label) {
        badge.className = 'badge ' + kind;
        badgeText.textContent = label;
      }

      function humanizeUptime(sec) {
        sec = Math.max(0, Math.floor(Number(sec) || 0));
        var h = Math.floor(sec / 3600);
        var m = Math.floor((sec % 3600) / 60);
        var s = sec % 60;
        var parts = [];
        if (h) parts.push(h + 'h');
        if (m) parts.push(m + 'm');
        parts.push(s + 's');
        return parts.join(' ') + ' (' + sec + 's)';
      }

      // Map status value -> badge (spec §3.2). Unknown/failure -> down (🔴).
      function render(data) {
        var status = data && typeof data.status === 'string' ? data.status : 'down';
        if (status === 'ok') setBadge('ok', '🟢 Operational');
        else if (status === 'degraded') setBadge('warn', '🟡 Degraded');
        else setBadge('down', '🔴 Down');

        elUptime.textContent = humanizeUptime(data.uptime_seconds);
        elVersion.textContent = data.version != null ? String(data.version) : '—';
        elTimestamp.textContent = data.timestamp != null ? String(data.timestamp) : '—';
        elError.style.display = 'none';
        elError.textContent = '';
      }

      function fail(message) {
        setBadge('down', '🔴 Down');
        elError.style.display = 'block';
        elError.textContent = message;
      }

      function poll() {
        fetch('/api/health', { cache: 'no-store', headers: { Accept: 'application/json' } })
          .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          })
          .then(render)
          .catch(function (err) {
            fail('Status check failed: ' + (err && err.message ? err.message : 'unknown'));
          });
      }

      poll();
      setInterval(poll, 5000); // recommended 5~30s polling (spec §6)
    })();
  </script>
</body>
</html>
