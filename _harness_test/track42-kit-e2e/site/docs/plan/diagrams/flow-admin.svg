<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" role="img" aria-labelledby="t d">
<title id="t">관리자 흐름</title>
<desc id="d">관리 화면 주소로 들어오면 A-04로 세션을 확인한다. 세션이 없으면 S-02에서 로그인하고, 비밀번호가 틀리거나 시도가 많으면 S-02에 머문다. 로그인되면 S-03과 S-04에서 고치고 저장한다. 로그아웃과 세션 만료는 S-02로 보낸다.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1c1c1c"/></marker></defs>
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#1c1c1c;font-size:14px}
.s{font-size:12px}.b{font-weight:700}.n{font-size:11px;fill:#555}
.box{fill:#fff;stroke:#1c1c1c;stroke-width:1.5}
.sub{fill:#f0f0f0;stroke:#1c1c1c}
.ln{fill:none;stroke:#1c1c1c;stroke-width:1.5}
</style>
<rect width="1000" height="650" fill="#fff"/>

<!-- 시작과 세션 확인 -->
<rect x="60" y="20" width="240" height="40" rx="20" class="sub"/>
<text x="180" y="45" text-anchor="middle">관리 화면 주소로 들어옴</text>
<path d="M180 60V79" class="ln" marker-end="url(#a)"/>
<path d="M180 80L280 120L180 160L80 120Z" class="box"/>
<text x="180" y="125" text-anchor="middle">A-04 세션 확인</text>
<path d="M180 160V199" class="ln" marker-end="url(#a)"/>
<text x="190" y="184" class="s">없음</text>

<!-- S-02 -->
<rect x="60" y="200" width="240" height="60" class="box"/>
<text x="180" y="225" text-anchor="middle" class="b">S-02 관리자 로그인</text>
<text x="180" y="246" text-anchor="middle" class="s">비밀번호 입력, 로그인 누름</text>
<path d="M180 260V299" class="ln" marker-end="url(#a)"/>
<path d="M180 300L280 340L180 380L80 340Z" class="box"/>
<text x="180" y="345" text-anchor="middle">A-02 로그인</text>

<!-- 로그인 오류 -->
<path d="M180 380V405M115 405H320M115 405V429M320 405V429" class="ln"/>
<path d="M115 420V429" class="ln" marker-end="url(#a)"/>
<path d="M320 420V429" class="ln" marker-end="url(#a)"/>
<text x="24" y="422" class="s">비밀번호 틀림</text>
<text x="330" y="422" class="s">시도 초과</text>
<rect x="20" y="430" width="190" height="60" class="sub"/>
<text x="115" y="454" text-anchor="middle" class="b s">오류 줄</text>
<text x="115" y="475" text-anchor="middle" class="s">비밀번호가 맞지 않습니다</text>
<rect x="225" y="430" width="190" height="60" class="sub"/>
<text x="320" y="454" text-anchor="middle" class="b s">오류 줄</text>
<text x="320" y="475" text-anchor="middle" class="s">로그인 시도가 많습니다</text>
<path d="M115 490V515M320 490V515M320 515H10V230H59" class="ln" marker-end="url(#a)"/>
<text x="20" y="536" class="s">S-02에 머묾, 비밀번호 다시 입력</text>

<!-- 로그인됨 -->
<path d="M280 120H590V199" class="ln" marker-end="url(#a)"/>
<text x="300" y="112" class="s">있음</text>
<path d="M280 340H420V121" class="ln" marker-end="url(#a)"/>
<text x="296" y="332" class="s">성공</text>

<!-- S-03 -->
<rect x="480" y="200" width="220" height="70" class="box"/>
<text x="590" y="228" text-anchor="middle" class="b">S-03 영업시간 관리</text>
<text x="590" y="251" text-anchor="middle" class="s">요일별 시각과 휴무를 고침</text>
<path d="M590 270V299" class="ln" marker-end="url(#a)"/>
<rect x="480" y="300" width="220" height="70" class="sub"/>
<text x="590" y="330" text-anchor="middle" class="s">저장 누름</text>
<text x="590" y="351" text-anchor="middle" class="s">A-06 영업시간 저장</text>
<path d="M590 370V399" class="ln" marker-end="url(#a)"/>
<rect x="480" y="400" width="220" height="60" class="box"/>
<text x="590" y="425" text-anchor="middle" class="s">성공: 저장 알림 «저장됨»</text>
<text x="590" y="446" text-anchor="middle" class="s">오류: 오류 줄, 입력은 그대로</text>

<!-- S-04 -->
<rect x="760" y="200" width="220" height="70" class="box"/>
<text x="870" y="228" text-anchor="middle" class="b">S-04 메뉴 관리</text>
<text x="870" y="251" text-anchor="middle" class="s">추가, 수정, 삭제, 품절, 순서</text>
<path d="M701 235H759" class="ln" marker-end="url(#a)"/>
<path d="M759 245H701" class="ln" marker-end="url(#a)"/>
<text x="730" y="224" text-anchor="middle" class="s">위쪽 줄</text>
<path d="M870 270V299" class="ln" marker-end="url(#a)"/>
<rect x="760" y="300" width="220" height="70" class="sub"/>
<text x="870" y="322" text-anchor="middle" class="s">추가 A-08, 수정과 품절 A-09</text>
<text x="870" y="341" text-anchor="middle" class="s">순서 A-11</text>
<text x="870" y="360" text-anchor="middle" class="s">삭제는 확인 창 뒤 A-10</text>
<path d="M870 370V399" class="ln" marker-end="url(#a)"/>
<rect x="760" y="400" width="220" height="60" class="box"/>
<text x="870" y="425" text-anchor="middle" class="s">성공: 저장 알림</text>
<text x="870" y="446" text-anchor="middle" class="s">오류: 오류 줄, 입력은 그대로</text>

<!-- 로그아웃, 세션 만료 -->
<text x="480" y="494" class="n">S-03, S-04 어느 화면에서든 일어난다</text>
<rect x="480" y="504" width="220" height="60" class="sub"/>
<text x="590" y="528" text-anchor="middle" class="s">로그아웃 누름: A-03</text>
<text x="590" y="549" text-anchor="middle" class="s">S-02에 «로그아웃됨» 표시</text>
<rect x="760" y="504" width="220" height="60" class="sub"/>
<text x="870" y="528" text-anchor="middle" class="s">세션 만료: 관리 API가 거절</text>
<text x="870" y="549" text-anchor="middle" class="s">S-02에 만료 안내 표시</text>
<path d="M590 564V610M870 564V610M870 610H10V515" class="ln"/>
<text x="456" y="630" class="s">S-02로 이동</text>
</svg>
