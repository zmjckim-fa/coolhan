  <rect class="chip" x="415" y="720" width="180" height="30"/>
  <text class="m" x="505" y="739" text-anchor="middle">menu-items.test.js</text>
  <rect class="chip" x="605" y="720" width="180" height="30"/>
  <text class="m" x="695" y="739" text-anchor="middle">home-screen.test.js</text>
  <rect class="chip" x="795" y="720" width="180" height="30"/>
  <text class="m" x="885" y="739" text-anchor="middle">admin-login-screen.test.js</text>
  <rect class="chip" x="985" y="720" width="180" height="30"/>
  <text class="m" x="1075" y="739" text-anchor="middle">admin-hours-screen.test.js</text>
  <rect class="chip" x="35" y="758" width="180" height="30"/>
  <text class="m" x="125" y="777" text-anchor="middle">admin-menu-screen.test.js</text>
  <rect class="chip" x="225" y="758" width="180" height="30"/>
  <text class="m" x="315" y="777" text-anchor="middle">screen-routes.test.js</text>
  <rect class="chip" x="415" y="758" width="180" height="30"/>
  <text class="m" x="505" y="777" text-anchor="middle">temporary-server.js</text>
  <rect class="chip" x="605" y="758" width="180" height="30"/>
  <text class="m" x="695" y="777" text-anchor="middle">screen-contract.js</text>
  <text class="t s" x="800" y="777">끝의 둘은 시험 지원 파일이다 (이름이 .test.js로 끝나지 않는다)</text>

  <text class="t b" x="20" y="826">화살표는 «부른다» 또는 «가져온다»의 방향이다. 라우트 표, 입력 규칙, 분류 목록, 영업 상태 계산, 오류 표, 문구 사전 읽기는 각각 파일 하나에만 있다.</text>
  <text class="t b" x="20" y="846">실선 칸은 src/ 15개, web/ 22개, test/ 16개다. 점선 칸은 세 폴더 밖의 파일이거나 다른 묶음에 이미 그린 파일이라 세지 않는다.</text>
</svg>
