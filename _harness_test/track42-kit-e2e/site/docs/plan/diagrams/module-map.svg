  <rect class="chip" x="855" y="124" width="170" height="30"/>
  <text class="m" x="940" y="143" text-anchor="middle">admin-login.js</text>
  <rect class="chip" x="1035" y="124" width="170" height="30"/>
  <text class="m" x="1120" y="143" text-anchor="middle">admin-login.css</text>
  <rect class="chip" x="675" y="162" width="170" height="30"/>
  <text class="m" x="760" y="181" text-anchor="middle">admin-hours.html</text>
  <rect class="chip" x="855" y="162" width="170" height="30"/>
  <text class="m" x="940" y="181" text-anchor="middle">admin-hours.js</text>
  <rect class="chip" x="1035" y="162" width="170" height="30"/>
  <text class="m" x="1120" y="181" text-anchor="middle">admin-hours.css</text>
  <rect class="chip" x="675" y="200" width="170" height="30"/>
  <text class="m" x="760" y="219" text-anchor="middle">admin-menu.html</text>
  <rect class="chip" x="855" y="200" width="170" height="30"/>
  <text class="m" x="940" y="219" text-anchor="middle">admin-menu.js</text>
  <rect class="chip" x="1035" y="200" width="170" height="30"/>
  <text class="m" x="1120" y="219" text-anchor="middle">admin-menu.css</text>
  <path class="line" d="M940 246 V274" marker-end="url(#mm-arrow)"/>
  <text class="t s" x="952" y="265">가져온다</text>

  <!-- 화면 바탕 -->
  <rect class="grp" x="660" y="276" width="560" height="114"/>
  <text class="t h" x="675" y="296">화면 바탕 (web/) 8개</text>
  <rect class="chip" x="675" y="306" width="125" height="30"/>
  <text class="m" x="737.5" y="325" text-anchor="middle">api-client.js</text>
  <rect class="chip" x="810" y="306" width="125" height="30"/>
  <text class="m" x="872.5" y="325" text-anchor="middle">text-dictionary.js</text>
  <rect class="chip" x="945" y="306" width="125" height="30"/>
  <text class="m" x="1007.5" y="325" text-anchor="middle">screen-feedback.js</text>
  <rect class="chip" x="1080" y="306" width="125" height="30"/>
  <text class="m" x="1142.5" y="325" text-anchor="middle">admin-top-bar.js</text>
  <rect class="chip" x="675" y="344" width="125" height="30"/>
  <text class="m" x="737.5" y="363" text-anchor="middle">input-rules.js</text>
  <rect class="chip" x="810" y="344" width="125" height="30"/>
  <text class="m" x="872.5" y="363" text-anchor="middle">text/ko.json</text>
  <rect class="chip" x="945" y="344" width="125" height="30"/>
  <text class="m" x="1007.5" y="363" text-anchor="middle">tokens.css</text>
  <rect class="chip" x="1080" y="344" width="125" height="30"/>
  <text class="m" x="1142.5" y="363" text-anchor="middle">screen.css</text>

  <!-- 없는 주소 응답 -->
  <path class="line" d="M940 418 V392" marker-end="url(#mm-arrow)"/>
  <text class="t s" x="952" y="409">가져온다</text>
  <rect class="grp" x="660" y="418" width="560" height="72"/>
  <text class="t h" x="675" y="438">없는 주소 응답 (web/) 2개</text>
  <rect class="chip" x="675" y="448" width="170" height="30"/>
  <text class="m" x="760" y="467" text-anchor="middle">not-found.html</text>
  <rect class="chip" x="855" y="448" width="170" height="30"/>
  <text class="m" x="940" y="467" text-anchor="middle">not-found.js</text>
  <text class="t s" x="1040" y="467">화면 번호가 없다</text>

  <!-- 화면 바탕 → 요청이 지나는 길 -->
  <path class="line" d="M660 333 H640 V203 H622" marker-end="url(#mm-arrow)"/>

  <!-- 시험 -->
  <rect class="grp" x="20" y="652" width="1200" height="148"/>
  <text class="t h" x="35" y="672">시험 (test/) 16개: 시험 파일 14개와 시험 지원 2개. 임시 DB 파일과 실제 서버에 HTTP 요청을 보낸다</text>
  <rect class="chip" x="35" y="682" width="180" height="30"/>
  <text class="m" x="125" y="701" text-anchor="middle">startup.test.js</text>
  <rect class="chip" x="225" y="682" width="180" height="30"/>
  <text class="m" x="315" y="701" text-anchor="middle">input-rules.test.js</text>
  <rect class="chip" x="415" y="682" width="180" height="30"/>
  <text class="m" x="505" y="701" text-anchor="middle">shop-status.test.js</text>
  <rect class="chip" x="605" y="682" width="180" height="30"/>
  <text class="m" x="695" y="701" text-anchor="middle">screen-files.test.js</text>
  <rect class="chip" x="795" y="682" width="180" height="30"/>
  <text class="m" x="885" y="701" text-anchor="middle">request-hardening.test.js</text>
  <rect class="chip" x="985" y="682" width="180" height="30"/>
  <text class="m" x="1075" y="701" text-anchor="middle">public-overview.test.js</text>
  <rect class="chip" x="35" y="720" width="180" height="30"/>
  <text class="m" x="125" y="739" text-anchor="middle">admin-login.test.js</text>
  <rect class="chip" x="225" y="720" width="180" height="30"/>
