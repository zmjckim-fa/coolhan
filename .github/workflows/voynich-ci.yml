name: Voynich Research Tool CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'tools/voynich-reference-analyzer/**'
  pull_request:
    branches: [main]
    paths:
      - 'tools/voynich-reference-analyzer/**'
  workflow_dispatch:

jobs:
  python-syntax:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd tools/voynich-reference-analyzer
          pip install -r requirements.txt --quiet

      - name: Syntax check all Python files
        run: |
          cd tools/voynich-reference-analyzer
          python -m py_compile modules/eva_parser.py
          python -m py_compile modules/statistics.py
          python -m py_compile modules/entropy.py
          python -m py_compile modules/rule_engine.py
          python -m py_compile modules/corpus_compare.py
          python -m py_compile modules/report_writer.py
          python -m py_compile modules/ingestion.py
          python -m py_compile modules/revalidation.py
          python -m py_compile modules/hypothesis_guard.py
          python -m py_compile scripts/init_db.py
          python -m py_compile scripts/demo_seed.py
          python -m py_compile scripts/run_pipeline.py
          echo "All Python files passed syntax check"

  schema-validation:
    name: Database Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate DB schema and pipeline
        run: |
          cd tools/voynich-reference-analyzer
          python scripts/init_db.py
          echo "Schema v0.2 + v0.3 applied"
          python -c "
          import sqlite3
          conn = sqlite3.connect('database/voynich.sqlite')
          tables = conn.execute(\"SELECT name FROM sqlite_master WHERE type='table' ORDER BY name\").fetchall()
          print(f'Tables created: {len(tables)}')
          assert len(tables) >= 25, f'Expected 25+ tables, got {len(tables)}'
          required = ['folio','token','glyph','rule_candidate','comparison_corpus',
                      'data_sources','research_claims','failure_cases','analysis_runs',
                      'rule_validation_history','hypothesis_evaluations']
          for t in required:
              names = [r[0] for r in tables]
              assert t in names, f'Missing table: {t}'
              print(f'  OK {t}')
          conn.close()
          print('All required tables present')
          "

  demo-pipeline:
    name: Demo Pipeline Test
    runs-on: ubuntu-latest
    needs: schema-validation
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd tools/voynich-reference-analyzer
          pip install pandas numpy --quiet

      - name: Run full demo pipeline
        run: |
          cd tools/voynich-reference-analyzer
          python scripts/init_db.py
          python scripts/demo_seed.py
          python -c "
          import sqlite3
          conn = sqlite3.connect('database/voynich.sqlite')
          folios = conn.execute('SELECT COUNT(*) FROM folio').fetchone()[0]
          tokens = conn.execute('SELECT COUNT(*) FROM token').fetchone()[0]
          rules = conn.execute('SELECT COUNT(*) FROM rule_candidate').fetchone()[0]
          corpora = conn.execute('SELECT COUNT(*) FROM comparison_corpus').fetchone()[0]
          failures = conn.execute('SELECT COUNT(*) FROM failure_cases').fetchone()[0]
          claims = conn.execute('SELECT COUNT(*) FROM research_claims').fetchone()[0]
          print(f'Folios: {folios}, Tokens: {tokens}, Rules: {rules}')
          print(f'Corpora: {corpora}, Failures: {failures}, Claims: {claims}')
          assert folios >= 10, 'Expected 10+ folios'
          assert rules >= 6, 'Expected 6+ rules'
          assert corpora >= 6, 'Expected 6 comparison corpora'
          assert failures >= 3, 'Expected 3+ failure cases'
          assert claims >= 2, 'Expected 2+ research claims'
          conn.close()
          print('Demo pipeline verified')
          "

  guardrail-test:
    name: Hypothesis Guardrail Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test hypothesis guardrail
        run: |
          cd tools/voynich-reference-analyzer
          python -c "
          import sys
          sys.path.insert(0, '.')
          from modules.hypothesis_guard import HypothesisGuard, guard

          # Test 1: Translation claim to facts table should fail
          ok, violations = guard.check_claim(
              'daiin translates to the word grass',
              'translation_claim',
              'token'  # wrong table for translation claim
          )
          assert not ok, 'Translation claim to facts table should be rejected'
          assert len(violations) > 0
          print('Test 1: Translation claim to facts table correctly rejected')

          # Test 2: Structural claim to research_claims is fine
          ok, violations = guard.check_claim(
              'Word-final constraint holds across sections',
              'structural_claim',
              'research_claims'
          )
          print('Test 2: Structural claim to claims table accepted')

          # Test 3: External source cannot be primary_evidence tier
          ok, v = guard.check_evidence_tier(is_source_external=True, target_tier='primary_evidence')
          assert not ok, 'External source as primary_evidence should be rejected'
          print('Test 3: External source in primary_evidence correctly rejected')

          # Test 4: Primary EVA source as primary_evidence is fine
          ok, v = guard.check_evidence_tier(is_source_external=False, target_tier='primary_evidence')
          assert ok, 'Internal primary source should be accepted as primary_evidence'
          print('Test 4: Internal primary source accepted')

          # Test 5: Validate ingestion plan
          report = guard.validate_ingestion_plan(
              source_type='external_research',
              evidence_tier='external_claim',
              is_external=True
          )
          assert report.is_compliant, 'External research as external_claim should be compliant'
          print('Test 5: External research ingestion plan validated')

          print()
          print('All guardrail tests passed')
          "

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [python-syntax, schema-validation, demo-pipeline, guardrail-test]
    if: always()
    steps:
      - name: Report results
        run: |
          echo "## Voynich CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python Syntax | ${{ needs.python-syntax.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Schema Validation | ${{ needs.schema-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Demo Pipeline | ${{ needs.demo-pipeline.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Guardrail Tests | ${{ needs.guardrail-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Hypothesis:** The Voynich Manuscript may share structural properties with reference/taxonomic corpora." >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Research tool -- NOT a decipherment claim." >> $GITHUB_STEP_SUMMARY
